kind = "web"
previewPath = "/dark/"
title = "Kristina Ermilova — Portfolio (Dark)"
version = "1.0.0"
id = "artifacts/portfolio-dark"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dark/" ]
localPort = 21524

[services.development]
run = "pnpm --filter @workspace/portfolio-dark run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio-dark", "run", "build" ]
publicDir = "artifacts/portfolio-dark/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21524"
BASE_PATH = "/dark/"
